name: Tagged build

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            # Manual run: select the highest version-numbered v* tag.
            tag="$(git tag --list 'v*' --sort=-version:refname | sed -n '1p')"
          fi
          if [[ -z "$tag" ]]; then
            echo 'No v* release tag found' >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building release tag: $tag"

  build:
    name: Reuse multi-platform CMake build
    needs: resolve-tag
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/cmake-multi-platform.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.tag }}
      upload_artifacts: true

  publish:
    name: Attach platform ZIPs to GitHub Release
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ispa-*
          path: release
          merge-multiple: false

      - name: Package platform ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          base = Path('release')
          packages = Path('packages')
          packages.mkdir(exist_ok=True)
          platforms = ('ispa-linux-x64', 'ispa-windows-x64',
                       'ispa-macos-arm64', 'ispa-macos-x64')
          for platform in platforms:
              folder = base / platform
              files = sorted(p for p in folder.iterdir() if p.is_file())
              if not files or not any(p.name in ('ispa', 'ispa.exe') for p in files):
                  raise RuntimeError(f'Missing executable in {folder}')
              archive_path = packages / f'{platform}.zip'
              with ZipFile(archive_path, 'w', compression=ZIP_DEFLATED,
                           compresslevel=9) as archive:
                  for path in files:
                      archive.write(path, arcname=path.name)
              print(f'Created {archive_path}: {[p.name for p in files]}')
          PYZIP
          ls -lh packages/

      - name: Create release if missing and attach ZIP archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" packages/*.zip --clobber
