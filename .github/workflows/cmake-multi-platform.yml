name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            triplet: x64-linux
            overlay_triplets: ""

          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            triplet: x64-linux-libcxx
            overlay_triplets: cmake/triplets

          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            triplet: x64-windows
            overlay_triplets: ""

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup CMake
        uses: lukka/get-cmake@v4.3.2

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-all-dev \
            libc++-dev \
            libc++abi-dev \
            valgrind

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/${{ matrix.overlay_triplets }}" \
            -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build build --config Release
