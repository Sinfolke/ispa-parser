name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_DIR: ${{ matrix.os == 'windows-latest' && 'C:\Users\runneradmin\AppData\Local\Mozilla\sccache' || '/home/runner/.cache/sccache' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: ubuntu-26.04
          #   c_compiler: gcc-15
          #   cpp_compiler: g++-15
          #   triplet: x64-linux
          #   overlay_triplets: ""
          #   extra_cxx_flags: ""

          - os: ubuntu-26.04
            c_compiler: clang-20
            cpp_compiler: clang++-20
            triplet: x64-linux-libcxx
            overlay_triplets: cmake/triplets
            extra_cxx_flags: "-stdlib=libc++"

          - os: windows-latest
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            triplet: x64-windows
            overlay_triplets: ""
            extra_cxx_flags: ""

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup CMake
        uses: lukka/get-cmake@v4.3.2

      - name: Setup MSVC Environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add LLVM bin to PATH (for clang-scan-deps)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Locate LLVM shipped with Visual Studio Enterprise on GitHub runners
          LLVM_DIR="C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/x64/bin"
          if [ -d "$LLVM_DIR" ]; then
            echo "$LLVM_DIR" >> $GITHUB_PATH
          fi

      # 1. Setup sccache action
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      # 2. Restore/Save sccache disk cache
      - name: Restore / Save sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ matrix.triplet }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.triplet }}-
            sccache-${{ runner.os }}-

      # 3. Export GitHub Actions Cache Token for vcpkg
      - name: Export GitHub Actions Cache Token
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');
      - name: Set vcpkg Binary Caching
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-20 \
            gcc-15 \
            libboost-all-dev \
            libc++-20-dev \
            libc++abi-20-dev \
            valgrind

      - name: Install ICU build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            gettext \
            make

      - name: Fix libc++ modules std path (Ubuntu clang)
        if: matrix.cpp_compiler == 'clang++-20'
        run: |
          real=/usr/lib/llvm-20/share/libc++/v1
          bogus=/lib/share/libc++/v1
          if [[ -d "$real" && ! -e "$bogus" ]]; then
            sudo mkdir -p "$(dirname "$bogus")"
            sudo ln -sfn "$real" "$bogus"
          fi
          ls -la "$bogus" 2>&1 || true

      - name: Zero sccache statistics
        run: sccache --zero-stats || true

      - name: Configure CMake
        shell: bash
        env:
          CC: ${{ matrix.c_compiler }}
          CXX: ${{ matrix.cpp_compiler }}
        run: |
          CMAKE_ARGS=(
            -B build
            -G Ninja
            "-DCMAKE_C_COMPILER_LAUNCHER=sccache"
            "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"
            "-DCMAKE_C_COMPILER=${{ matrix.c_compiler }}"
            "-DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}"
            "-DCMAKE_CXX_SCAN_FOR_MODULES=ON"
            "-DCMAKE_BUILD_TYPE=Release"
            -S "${{ github.workspace }}"
          )
                  
          # Force /Z7 for MSVC so sccache can cache MSVC compilation targets
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            CMAKE_ARGS+=(
              "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
            )
          fi

          if [[ -n "${{ matrix.extra_cxx_flags }}" ]]; then
            CMAKE_ARGS+=(
              "-DCMAKE_CXX_FLAGS=${{ matrix.extra_cxx_flags }}"
              "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.extra_cxx_flags }}"
              "-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.extra_cxx_flags }}"
            )
          fi
          
          if [[ -n "${{ matrix.overlay_triplets }}" ]]; then
            CMAKE_ARGS+=(
              "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/${{ matrix.overlay_triplets }}"
            )
          fi
          
          cmake "${CMAKE_ARGS[@]}"
      - name: Flush and save vcpkg binary cache
        if: always()
        run: |
          vcpkg x-check-support --version || true
      - name: Build
        run: cmake --build build --config Release

      - name: Show sccache statistics
        run: sccache --show-stats

      # 4. Stop daemon to ensure all cached outputs are flushed before actions/cache uploads
      - name: Stop sccache daemon
        if: always()
        run: sccache --stop-server || true

